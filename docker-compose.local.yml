# Local-only run of the production image — no Traefik, no external network, port published
# directly on the host. Useful for testing the Docker build itself, or self-hosting without a
# reverse proxy. Not used by Arcane's deploy (that pulls and runs docker-compose.yml).
#
#   cp .env.example .env   # see README "HTTPS without a domain" if accessed as more than
#                          # http://localhost — browser APIs the app needs require a secure
#                          # context, so a LAN IP/hostname needs TLS_CERT_PATH/TLS_KEY_PATH,
#                          # COOKIE_SECURE=true and a matching APP_ORIGIN.
#   mkdir -p data
#   docker compose -f docker-compose.local.yml up -d --build
#
# APP_DOMAIN in .env is ignored by this file (no Traefik here).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - 8787:8787
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs # only needed when TLS_CERT_PATH/TLS_KEY_PATH point in here
