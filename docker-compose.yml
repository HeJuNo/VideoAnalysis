# Production deploy (not used for local dev — that's `npm run dev`; see docker-compose.local.yml
# to run this image locally instead). Deployed by Arcane's Git Sync (Pull), not by hand:
#   Arcane > Customization > Git Repositories > add this repo
#   Arcane > Projects > Create from Git Repo (Pull) > Compose File Path: docker-compose.yml
#   Enable Auto Sync + Redeploy After Sync to deploy automatically on every push.
# This file is read-only once synced — edit it here, push, then "Sync from Git" in Arcane.
# COOKIE_SECURE, APP_ORIGIN, APP_DOMAIN and S3_* are set in Arcane's project environment settings,
# never committed. The Traefik network name is the literal `core-web` below, not an env var —
# change it here (and push) if your Traefik network is named differently.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - core-web
    labels:
      - traefik.enable=true
      - traefik.http.routers.video-analysis.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.video-analysis.entrypoints=websecure
      - traefik.http.routers.video-analysis.tls.certresolver=letsencrypt
      - traefik.http.services.video-analysis.loadbalancer.server.port=8787

networks:
  core-web:
    external: true